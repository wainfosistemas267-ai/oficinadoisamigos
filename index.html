<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel da Oficina</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#d2691e">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f0eee8; --panel:#ffffff; --ink:#191d1a; --ink-soft:#6b7169;
  --line:#e3ded3; --accent:#d2691e; --accent-ink:#ffffff;
  --steel:#3c6470; --ok:#3f7a4d; --warn:#b8862c; --danger:#c0392b;
  --chip:#f0ece1; --shadow:0 1px 2px rgba(25,29,26,.04), 0 6px 16px rgba(25,29,26,.06);
  --radius:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14161a; --panel:#1e2126; --ink:#eceef0; --ink-soft:#9297a0;
    --line:#2b2f36; --accent:#e8813d; --accent-ink:#14161a;
    --steel:#7fb0bd; --ok:#6fbf7c; --warn:#dba64b; --danger:#e57366;
    --chip:#262a31; --shadow:0 1px 2px rgba(0,0,0,.25), 0 10px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#14161a; --panel:#1e2126; --ink:#eceef0; --ink-soft:#9297a0;
  --line:#2b2f36; --accent:#e8813d; --accent-ink:#14161a;
  --steel:#7fb0bd; --ok:#6fbf7c; --warn:#dba64b; --danger:#e57366;
  --chip:#262a31; --shadow:0 1px 2px rgba(0,0,0,.25), 0 10px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{
  background:var(--bg); color:var(--ink);
  font-family:'Sora',Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');
h1,h2,h3{font-family:'Space Grotesk',sans-serif; letter-spacing:-0.01em; margin:0;}
.wrap{max-width:960px;margin:0 auto;padding:24px 18px 70px;}
header{display:flex;align-items:center;gap:16px;margin-bottom:22px;}
header img.logo{width:52px;height:52px;border-radius:14px;object-fit:cover;flex-shrink:0;box-shadow:var(--shadow);}
header h1{font-size:19px;font-weight:700;letter-spacing:.01em;}
header p{margin:3px 0 0;color:var(--ink-soft);font-size:13px;}
nav{display:flex;gap:2px;margin-bottom:22px;background:var(--chip);padding:4px;border-radius:12px;max-width:100%;overflow-x:auto;}
nav button{
  background:none;border:none;color:var(--ink-soft);font:600 13px 'Sora',sans-serif;
  padding:9px 14px;cursor:pointer;border-radius:9px;white-space:nowrap;transition:background .15s,color .15s;flex-shrink:0;
}
nav button.active{color:var(--accent-ink);background:var(--accent);box-shadow:var(--shadow);}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow);}
.panel h2{font-size:16px;font-weight:700;margin-bottom:14px;color:var(--ink);}
.panel h3{font-size:12.5px;margin-bottom:10px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;font-weight:600;}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
.row > *{flex:1;min-width:110px;}
label{font-size:11.5px;color:var(--ink-soft);display:block;margin-bottom:4px;font-weight:500;}
input,select,textarea{
  width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;
  background:var(--bg);color:var(--ink);font:14px 'Sora',sans-serif;transition:border-color .15s,box-shadow .15s;
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent);}
textarea{resize:vertical;min-height:50px;}
button.btn{
  background:var(--accent);color:var(--accent-ink);border:none;border-radius:11px;
  padding:10px 18px;font:700 13.5px 'Sora',sans-serif;cursor:pointer;box-shadow:var(--shadow);
  transition:transform .1s,filter .15s;
}
button.btn:hover{filter:brightness(1.06);}
button.btn.secondary{background:var(--panel);color:var(--steel);border:1.5px solid var(--line);box-shadow:none;}
button.btn.secondary:hover{border-color:var(--steel);}
button.btn.whatsapp{background:var(--panel);color:#25995c;border:1.5px solid #bfe3cf;box-shadow:none;}
button.btn.whatsapp:hover{border-color:#25995c;}
button.btn.danger{background:var(--panel);color:var(--danger);border:1.5px solid var(--line);box-shadow:none;}
button.btn.danger:hover{border-color:var(--danger);}
button.btn:active{transform:translateY(1px) scale(.99);}
table{width:100%;border-collapse:collapse;font-size:13.5px;}
table.scroll-wrap{display:block;overflow-x:auto;}
th{text-align:left;color:var(--ink-soft);font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;border-bottom:1.5px solid var(--line);padding:8px 8px;}
td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tbody tr{transition:background .12s;}
tbody tr:hover{background:var(--bg);}
tr.low-stock td{color:var(--danger);}
tr.editing-row td{background:color-mix(in srgb, var(--accent) 10%, transparent);}
.right{text-align:right;}
.tag{display:inline-block;padding:4px 11px;border-radius:20px;font-size:10.5px;font-weight:700;letter-spacing:.02em;background:var(--chip);color:var(--ink-soft);}
.tag.aberta{color:var(--warn);background:color-mix(in srgb, var(--warn) 16%, var(--chip));}
.tag.andamento{color:var(--steel);background:color-mix(in srgb, var(--steel) 16%, var(--chip));}
.tag.concluida{color:var(--ok);background:color-mix(in srgb, var(--ok) 16%, var(--chip));}
.tag.area-mecanica{color:var(--steel);background:color-mix(in srgb, var(--steel) 16%, var(--chip));}
.tag.area-pintura{color:var(--accent);background:color-mix(in srgb, var(--accent) 16%, var(--chip));}
.tag.baixo{color:var(--danger);background:color-mix(in srgb, var(--danger) 16%, var(--chip));}
.empty{color:var(--ink-soft);font-size:13px;padding:20px 0;text-align:center;}
.item-line{display:flex;gap:8px;align-items:flex-end;margin-bottom:10px;flex-wrap:wrap;}
.item-line select{flex:2;min-width:150px;}
.item-line input{flex:1;min-width:70px;}
.total-line{display:flex;justify-content:space-between;font:700 18px 'Space Grotesk',sans-serif;margin-top:12px;padding-top:12px;border-top:1.5px solid var(--line);}
.doc{white-space:pre-wrap;font-family:'Sora',sans-serif;font-size:12.5px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:10px;line-height:1.55;}
.iconbtn{background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:15px;padding:2px 6px;border-radius:6px;transition:color .12s,background .12s;}
.iconbtn:hover{color:var(--danger);background:var(--chip);}
.iconbtn.edit:hover{color:var(--steel);}
small.hint{color:var(--ink-soft);font-size:11.5px;display:block;margin-top:6px;}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;}
.stat-box{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px;}
.stat-box .num{font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;}
.stat-box .lab{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;margin-top:2px;}
.client-card{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;}
.vehicle-chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:4px 10px 4px 12px;font-size:12px;margin:3px 6px 3px 0;}
.vehicle-chip button{background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:13px;padding:0;}
.profile-badge{color:var(--ink-soft);font-size:12px;margin-top:2px;}
.profile-badge button{background:none;border:none;color:var(--steel);text-decoration:underline;font-size:11.5px;cursor:pointer;padding:0;margin-left:6px;}
.lock-choice{display:flex;flex-direction:column;gap:10px;}
.lock-choice button{width:100%;}
::selection{background:var(--accent);color:var(--accent-ink);}
@media(max-width:520px){ .row>*{min-width:100%;} .wrap{padding:18px 14px 60px;} }
</style>
</head>

const firebaseConfig = {

function isAdmin(){ return currentProfile==='admin'; }

function setSyncStatus(text, color){
  const el = document.getElementById('sync-status');
  if(el){ el.textContent = text; el.style.color = color || ''; }
}
function save(){
  setSyncStatus('Salvando…', 'var(--warn)');
  DOC_REF.set({ parts, quotes, osList, clients, nextPartId, nextQuoteN, nextOsN, nextClientId, responsibles, adminPin })
    .then(()=> setSyncStatus('Sincronizado ✓', 'var(--ok)'))

}
function renderAll(){

  renderPainel(); renderEstoque(); renderClientes(); renderOrcamentos(); renderOS();
}
function startSync(){
  DOC_REF.onSnapshot(doc=>{
    if(doc.exists){
      const d = doc.data();
      parts = d.parts || [];
      quotes = d.quotes || [];
      osList = d.osList || [];
      clients = d.clients || [];
      nextPartId = d.nextPartId || 1;
      nextQuoteN = d.nextQuoteN || 1;
      nextOsN = d.nextOsN || 1;
      nextClientId = d.nextClientId || 1;
      responsibles = d.responsibles || responsibles;
      adminPin = d.adminPin || '116365';
      if(!responsibles.mecanica.pin) responsibles.mecanica.pin = '';
      if(!responsibles.pintura.pin) responsibles.pintura.pin = '';
      // migração: clientes antigos tinham "placa" única em vez de vários veículos
      clients.forEach(c=>{
        if(!c.vehicles){
          c.vehicles = c.placa ? [{id:1, placa:c.placa, modelo:''}] : [];
          delete c.placa;
        }
      });
    }
    setSyncStatus('Sincronizado ✓', 'var(--ok)');
    renderAll();
  }, err=>{
    console.error('Erro ao sincronizar com o Firebase:', err);
    setSyncStatus('Sem conexão com o Firebase', 'var(--danger)');
  });
}
firebase.auth().signInAnonymously()
  .then(()=>{ setSyncStatus('Conectando…', 'var(--warn)'); startSync(); })
  .catch(e=>{
    console.error('Erro de autenticação Firebase:', e);
    setSyncStatus('Erro de conexão — configure o firebaseConfig', 'var(--danger)');

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=> navigator.serviceWorker.register('sw.js').catch(e=>console.log('Service worker não registrado:', e)));
}

function brl(n){ return 'R$ ' + (Number(n)||0).toFixed(2).replace('.',','); }
function sellPrice(p){ return p.buyPrice * (1 + p.margin/100); }
function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function todayIso(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function isoToDisplay(iso){ if(!iso) return ''; const [y,m,d]=iso.split('-'); return `${d}/${m}/${y}`; }
function displayToIso(disp){ if(!disp) return todayIso(); const [d,m,y]=disp.split('/'); return `${y}-${m}-${d}`; }
function areaLabel(a){ return AREAS[a] ? AREAS[a].label : a; }
function isCurrentMonth(dateStr){
  if(!dateStr) return false;
  const p = dateStr.split('/'); if(p.length!==3) return false;
  const m = parseInt(p[1]), y = parseInt(p[2]);
  const now = new Date();
  return m===(now.getMonth()+1) && y===now.getFullYear();
}
function adjustStock(items, sign){
  items.forEach(it=>{
    const p = parts.find(x=>x.id===it.partId);
    if(p){ p.stock = p.stock + sign*it.qty; }
  });
}
function toWaNumber(phone){
  let d = (phone||'').replace(/\D/g,'');
  if(!d) return '';
  if(d.length<=11) d = '55'+d;
  return d;
}
function clientPhoneFor(clientId){
  let phone = '';
  if(clientId){ const c = clients.find(x=>x.id===clientId); if(c) phone = c.phone; }
  if(!phone){ phone = prompt('Número de WhatsApp do cliente (com DDD):','') || ''; }
  return phone;
}

// ---------- EXPORTAR CSV ----------
function downloadCsv(filename, rows){
  const BOM = '\ufeff';
  const csv = BOM + rows.map(r=>r.map(cell=>{
    let s = String(cell===undefined||cell===null ? '' : cell);
    if(s.includes(';')||s.includes('"')||s.includes('\n')){ s = '"'+s.replace(/"/g,'""')+'"'; }
    return s;
  }).join(';')).join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
}
function exportEstoqueCsv(){
  const areas = visibleAreas();
  const rows = [['Área','Peça','Código','Preço de compra','Margem %','Preço de venda','Estoque']];
  parts.filter(p=>areas.includes(p.area)).forEach(p=> rows.push([areaLabel(p.area), p.name, p.code||'', p.buyPrice.toFixed(2).replace('.',','), p.margin, sellPrice(p).toFixed(2).replace('.',','), p.stock]));
  downloadCsv('estoque.csv', rows);
}
function exportOrcamentosCsv(){
  const areas = visibleAreas();
  const rows = [['Nº','Data','Área','Cliente','Responsável','Mão de obra','Total']];
  quotes.filter(q=>areas.includes(q.area)).forEach(q=> rows.push([q.id, q.date, areaLabel(q.area), q.client, q.responsibleName, (q.labor||0).toFixed(2).replace('.',','), q.total.toFixed(2).replace('.',',')]));
  downloadCsv('orcamentos.csv', rows);
}
function exportOsCsv(){
  const areas = visibleAreas();
  const rows = [['Nº','Data','Área','Cliente','CPF','Placa','Responsável','Status','Mão de obra','Total']];
  osList.filter(o=>areas.includes(o.area)).forEach(o=> rows.push([o.id, o.date, areaLabel(o.area), o.client, o.cpf||'', o.placa||'', o.responsibleName, statusLabel(o.status), (o.labor||0).toFixed(2).replace('.',','), o.total.toFixed(2).replace('.',',')]));
  downloadCsv('ordens_de_servico.csv', rows);
}

// ---------- PAINEL ----------
function renderPainel(){
  const el = document.getElementById('tab-painel');
  const areas = visibleAreas();
  const osMonth = osList.filter(o=>isCurrentMonth(o.date) && areas.includes(o.area));
  const concluidas = osMonth.filter(o=>o.status==='concluida');
  const fatTotal = concluidas.reduce((s,o)=>s+o.total,0);
  const fatMec = concluidas.filter(o=>o.area==='mecanica').reduce((s,o)=>s+o.total,0);
  const fatPint = concluidas.filter(o=>o.area==='pintura').reduce((s,o)=>s+o.total,0);
  const cAberta = osMonth.filter(o=>o.status==='aberta').length;
  const cAndamento = osMonth.filter(o=>o.status==='andamento').length;
  const cConcluida = concluidas.length;
  const lowStock = parts.filter(p=>p.stock<=LOW_STOCK_THRESHOLD && areas.includes(p.area));
  const qtyMap = {};
  osMonth.forEach(o=> o.items.forEach(it=>{ qtyMap[it.name] = (qtyMap[it.name]||0) + it.qty; }));
  const topParts = Object.entries(qtyMap).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const now = new Date();
  const mesNome = now.toLocaleDateString('pt-BR', {month:'long', year:'numeric'});

  const statBoxes = isAdmin() ? `
      <div class="stat-box"><div class="num">${brl(fatTotal)}</div><div class="lab">Total do mês</div></div>
      <div class="stat-box"><div class="num">${brl(fatMec)}</div><div class="lab">Mecânica</div></div>
      <div class="stat-box"><div class="num">${brl(fatPint)}</div><div class="lab">Pintura e Lanternagem</div></div>
  ` : `
      <div class="stat-box"><div class="num">${brl(fatTotal)}</div><div class="lab">Total do mês — ${areaLabel(currentProfile)}</div></div>
  `;

  el.innerHTML = `
    <div class="panel">
      <h2>Faturamento — ${mesNome}</h2>
      <small class="hint">Soma das OS com status "Concluída" emitidas neste mês.</small>
      <div class="stat-grid" style="margin-top:12px">${statBoxes}</div>
    </div>
    <div class="panel">
      <h2>Ordens de serviço — ${mesNome}</h2>
      <div class="stat-grid">
        <div class="stat-box"><div class="num">${cAberta}</div><div class="lab">Abertas</div></div>
        <div class="stat-box"><div class="num">${cAndamento}</div><div class="lab">Em andamento</div></div>
        <div class="stat-box"><div class="num">${cConcluida}</div><div class="lab">Concluídas</div></div>
      </div>
    </div>
    <div class="panel">
      <h2>Estoque baixo <span class="tag baixo">${lowStock.length}</span></h2>
      <small class="hint">Peças com ${LOW_STOCK_THRESHOLD} unidades ou menos.</small>
      ${lowStock.length===0 ? '<div class="empty">Nenhuma peça com estoque baixo.</div>' : `
      <table style="margin-top:10px"><tbody>
      ${lowStock.map(p=>`<tr><td>${escapeHtml(p.name)}</td><td>${areaLabel(p.area)}</td><td class="right">${p.stock} un.</td></tr>`).join('')}
      </tbody></table>`}
    </div>
    <div class="panel">
      <h2>Peças mais usadas no mês</h2>
      ${topParts.length===0 ? '<div class="empty">Nenhuma peça usada este mês ainda.</div>' : `
      <table><tbody>
      ${topParts.map(([name,qty])=>`<tr><td>${escapeHtml(name)}</td><td class="right">${qty} un.</td></tr>`).join('')}
      </tbody></table>`}
    </div>
    <div class="panel">
      <h2>Relatórios</h2>
      <small class="hint">Baixa uma planilha (.csv, abre direto no Excel) com os dados atuais.</small>
      <div class="row" style="margin-top:12px">
        <button class="btn secondary" onclick="exportEstoqueCsv()">Exportar estoque</button>
        <button class="btn secondary" onclick="exportOrcamentosCsv()">Exportar orçamentos</button>
        <button class="btn secondary" onclick="exportOsCsv()">Exportar OS</button>
      </div>
    </div>`;
}

// ---------- ESTOQUE ----------
function renderEstoque(){
  const el = document.getElementById('tab-estoque');
  const areas = visibleAreas();
  const term = partSearch.toLowerCase();
  const matches = p => !term || p.name.toLowerCase().includes(term) || (p.code||'').toLowerCase().includes(term);
  const mecParts = parts.filter(p=>p.area==='mecanica' && matches(p));
  const pintParts = parts.filter(p=>p.area==='pintura' && matches(p));
  const editing = partEditId ? parts.find(p=>p.id===partEditId) : null;
  const defaultArea = editing ? editing.area : (isAdmin() ? 'mecanica' : currentProfile);

  let responsibleRows = '';
  if(isAdmin() || currentProfile==='mecanica'){
    responsibleRows += `
      <div class="row">
        <div><label>Mecânica</label><input value="Ramiro Henrique" disabled></div>
        <div><label>Telefone (Ramiro)</label><input id="resp-phone-mecanica" value="${escapeHtml(responsibles.mecanica.phone)}" placeholder="(00) 00000-0000" onchange="saveResponsible('mecanica')"></div>
        <div><label>PIN de acesso</label><input id="resp-pin-mecanica" type="password" value="${escapeHtml(responsibles.mecanica.pin)}" placeholder="opcional" onchange="saveResponsible('mecanica')"></div>
      </div>`;
  }
  if(isAdmin() || currentProfile==='pintura'){
    responsibleRows += `
      <div class="row">
        <div><label>Pintura e Lanternagem</label><input value="Jorge" disabled></div>
        <div><label>Telefone (Jorge)</label><input id="resp-phone-pintura" value="${escapeHtml(responsibles.pintura.phone)}" placeholder="(00) 00000-0000" onchange="saveResponsible('pintura')"></div>
        <div><label>PIN de acesso</label><input id="resp-pin-pintura" type="password" value="${escapeHtml(responsibles.pintura.pin)}" placeholder="opcional" onchange="saveResponsible('pintura')"></div>
      </div>`;
  }
  if(isAdmin()){
    responsibleRows += `
      <div class="row">
        <div><label>PIN do Administrador</label><input id="admin-pin" type="password" value="${escapeHtml(adminPin)}" placeholder="opcional" onchange="saveAdminPin()"></div>
      </div>`;
  }

  el.innerHTML = `
    <div class="panel">
      <h2>Responsáveis pela área</h2>
      ${responsibleRows}
      <small class="hint">O nome e o telefone do responsável saem impressos nos orçamentos e OS daquela área. O PIN é pedido ao trocar de perfil — deixe em branco se não quiser usar PIN.</small>
    </div>
    <div class="panel">
      <h2>${editing ? `Editando peça — ${escapeHtml(editing.name)}` : 'Adicionar peça'}</h2>
      <div class="row">
        <div><label>Área</label>
          <select id="p-area" ${isAdmin()?'':'disabled'}>
            ${isAdmin() ? `
            <option value="mecanica" ${defaultArea==='mecanica'?'selected':''}>Mecânica</option>
            <option value="pintura" ${defaultArea==='pintura'?'selected':''}>Pintura e Lanternagem</option>
            ` : `<option value="${defaultArea}" selected>${areaLabel(defaultArea)}</option>`}
          </select>
        </div>
        <div><label>Nome da peça</label><input id="p-name" value="${editing?escapeHtml(editing.name):''}" placeholder="Ex: Pastilha de freio"></div>
        <div><label>Código</label><input id="p-code" value="${editing?escapeHtml(editing.code||''):''}" placeholder="Ex: PF-220"></div>
      </div>
      <div class="row">
        <div><label>Preço de compra (R$)</label><input id="p-buy" type="number" step="0.01" min="0" value="${editing?editing.buyPrice:''}"></div>
        <div><label>Margem (%)</label><input id="p-margin" type="number" step="1" min="0" value="${editing?editing.margin:30}"></div>
        <div><label>Qtd. em estoque</label><input id="p-stock" type="number" step="1" min="0" value="${editing?editing.stock:0}"></div>
      </div>
      <div class="row">
        <button class="btn" onclick="addPart()">${editing ? 'Salvar alterações' : 'Adicionar ao estoque'}</button>
        ${editing ? '<button class="btn secondary" onclick="cancelEditPart()">Cancelar</button>' : ''}
      </div>
    </div>
    <div class="panel">
      <input id="p-search" placeholder="Buscar peça por nome ou código..." value="${escapeHtml(partSearch)}" oninput="partSearch=this.value; renderEstoque();">
    </div>
    ${areas.includes('mecanica') ? stockTable('Estoque — Mecânica (Ramiro Henrique)', mecParts) : ''}
    ${areas.includes('pintura') ? stockTable('Estoque — Pintura e Lanternagem (Jorge)', pintParts) : ''}
  `;
}
function stockTable(title, list){
  return `<div class="panel">
    <h2>${title} (${list.length})</h2>
    ${list.length===0 ? '<div class="empty">Nenhuma peça encontrada.</div>' : `
    <table class="scroll-wrap"><thead><tr>
      <th>Peça</th><th>Código</th><th class="right">Compra</th><th class="right">Margem</th><th class="right">Venda</th><th class="right">Estoque</th><th></th>
    </tr></thead><tbody>
    ${list.map(p=>`
      <tr class="${p.stock<=LOW_STOCK_THRESHOLD?'low-stock':''} ${p.id===partEditId?'editing-row':''}">
        <td>${escapeHtml(p.name)}</td>
        <td>${escapeHtml(p.code)||'—'}</td>
        <td class="right">${brl(p.buyPrice)}</td>
        <td class="right">${p.margin}%</td>
        <td class="right">${brl(sellPrice(p))}</td>
        <td class="right">${p.stock}${p.stock<=LOW_STOCK_THRESHOLD?' <span class="tag baixo">baixo</span>':''}</td>
        <td class="right">
          <button class="iconbtn edit" onclick="editPart(${p.id})" title="Editar">✎</button>
          <button class="iconbtn" onclick="removePart(${p.id})" title="Remover">✕</button>
        </td>
      </tr>`).join('')}
    </tbody></table>`}
  </div>`;
}
function saveResponsible(area){
  const phoneEl = document.getElementById('resp-phone-'+area);
  if(phoneEl) responsibles[area].phone = phoneEl.value.trim();
  const pinEl = document.getElementById('resp-pin-'+area);
  if(pinEl) responsibles[area].pin = pinEl.value.trim();
  save();
}
function saveAdminPin(){
  adminPin = document.getElementById('admin-pin').value.trim();
  save();
}
function editPart(id){ partEditId = id; renderEstoque(); document.getElementById('tab-estoque').scrollIntoView({behavior:'smooth'}); }
function cancelEditPart(){ partEditId = null; renderEstoque(); }
function addPart(){
  const area = document.getElementById('p-area').value;
  const name = document.getElementById('p-name').value.trim();
  const code = document.getElementById('p-code').value.trim();
  const buy = parseFloat(document.getElementById('p-buy').value)||0;
  const margin = parseFloat(document.getElementById('p-margin').value)||0;
  const stock = parseInt(document.getElementById('p-stock').value)||0;
  if(!name){ alert('Informe o nome da peça.'); return; }
  if(partEditId){
    const p = parts.find(x=>x.id===partEditId);
    Object.assign(p, {area, name, code, buyPrice:buy, margin, stock});
    partEditId = null;
  } else {
    parts.push({id:nextPartId++, area, name, code, buyPrice:buy, margin, stock});
  }
  save(); renderAll();
}
function removePart(id){
  if(!confirm('Remover esta peça do estoque?')) return;
  if(partEditId===id) partEditId = null;
  parts = parts.filter(p=>p.id!==id); save(); renderAll();
}

// ---------- CLIENTES ----------
function clientLabel(c){
  const v = (c.vehicles&&c.vehicles[0]) ? ' — '+c.vehicles[0].placa : '';
  return c.name + v;
}
function clientHistory(c){
  const qs = quotes.filter(q=> q.clientId===c.id || (!q.clientId && q.client===c.name));
  const os = osList.filter(o=> o.clientId===c.id || (!o.clientId && o.client===c.name));
  return {qs, os};
}
function renderClientes(){
  const el = document.getElementById('tab-clientes');
  const term = clientSearch.toLowerCase();
  const filtered = clients.filter(c=>
    !term || c.name.toLowerCase().includes(term) || (c.cpf||'').includes(term) ||
    (c.vehicles||[]).some(v=>(v.placa||'').toLowerCase().includes(term))
  );
  const editing = clientEditId ? clients.find(c=>c.id===clientEditId) : null;
  el.innerHTML = `
    <div class="panel">
      <h2>${editing ? `Editando cliente — ${escapeHtml(editing.name)}` : 'Novo cliente'}</h2>
      <div class="row">
        <div><label>Nome completo</label><input id="c-name" value="${editing?escapeHtml(editing.name):''}" placeholder="Nome do cliente"></div>
        <div><label>Telefone (WhatsApp)</label><input id="c-phone" value="${editing?escapeHtml(editing.phone||''):''}" placeholder="(00) 00000-0000"></div>
      </div>
      <div class="row">
        <div><label>CPF</label><input id="c-cpf" value="${editing?escapeHtml(editing.cpf||''):''}" placeholder="000.000.000-00"></div>
        ${editing ? '' : '<div><label>Placa do veículo (opcional)</label><input id="c-placa" placeholder="ABC-1D23" style="text-transform:uppercase"></div>'}
      </div>
      <small class="hint">${editing ? 'Os veículos deste cliente são editados pelo card dele, na lista abaixo.' : 'Depois de salvo, dá pra adicionar mais veículos ao cliente pelo card dele abaixo.'}</small>
      <div class="row" style="margin-top:10px">
        <button class="btn" onclick="addClient()">${editing ? 'Salvar alterações' : 'Salvar cliente'}</button>
        ${editing ? '<button class="btn secondary" onclick="cancelEditClient()">Cancelar</button>' : ''}

    <div class="panel">
      <h2>Clientes cadastrados (${clients.length})</h2>
      <input id="c-search" placeholder="Buscar por nome, CPF ou placa..." value="${escapeHtml(clientSearch)}" oninput="clientSearch=this.value; renderClientes();" style="margin-bottom:12px">
      ${filtered.length===0 ? '<div class="empty">Nenhum cliente encontrado.</div>' : filtered.map(c=>renderClientCard(c)).join('')}

}
function renderClientCard(c){
  const {qs, os} = clientHistory(c);
  const open = clientHistoryOpenId===c.id;
  const vehicles = c.vehicles || [];
  return `<div class="client-card">
    <div class="row" style="align-items:center;margin-bottom:4px">
      <strong style="flex:2">${escapeHtml(c.name)}</strong>
      <button class="iconbtn edit" onclick="editClient(${c.id})" title="Editar">✎</button>
      <button class="iconbtn" onclick="removeClient(${c.id})" title="Remover">✕</button>
    </div>
    <small class="hint">${c.cpf?`CPF ${escapeHtml(c.cpf)} · `:''}${c.phone?`Tel: ${escapeHtml(c.phone)}`:'sem telefone'}</small>
    <div style="margin-top:8px">
      ${vehicles.map(v=>`<span class="vehicle-chip">${escapeHtml(v.placa)}${v.modelo?' · '+escapeHtml(v.modelo):''}<button onclick="removeVehicle(${c.id},${v.id})" title="Remover veículo">✕</button></span>`).join('')}
      <button class="iconbtn" onclick="addVehicle(${c.id})" title="Adicionar veículo" style="border:1px dashed var(--line);border-radius:20px;padding:4px 10px;font-size:12px">+ veículo</button>
    </div>
    <div class="row" style="margin-top:10px">
      <button class="btn secondary" onclick="toggleClientHistory(${c.id})">${open?'Ocultar histórico':`Ver histórico (${qs.length+os.length})`}</button>
    </div>
    ${open ? `
      ${qs.length===0 && os.length===0 ? '<div class="empty">Nenhum orçamento ou OS ainda.</div>' : ''}
      ${qs.map(q=>`<div class="row" style="align-items:center"><span style="flex:2">Orçamento #${q.id} — ${q.date}</span><span class="tag area-${q.area}">${areaLabel(q.area)}</span><span style="flex:0;font-weight:700">${brl(q.total)}</span></div>`).join('')}
      ${os.map(o=>`<div class="row" style="align-items:center"><span style="flex:2">OS #${o.id} — ${o.date}</span><span class="tag ${o.status}">${statusLabel(o.status)}</span><span style="flex:0;font-weight:700">${brl(o.total)}</span></div>`).join('')}
    ` : ''}
  </div>`;
}
function toggleClientHistory(id){ clientHistoryOpenId = clientHistoryOpenId===id ? null : id; renderClientes(); }
function addClient(){
  const name = document.getElementById('c-name').value.trim();
  const phone = document.getElementById('c-phone').value.trim();
  const cpf = document.getElementById('c-cpf').value.trim();
  if(!name){ alert('Informe o nome do cliente.'); return; }
  if(clientEditId){
    const c = clients.find(x=>x.id===clientEditId);
    Object.assign(c, {name, phone, cpf});
    clientEditId = null;
  } else {
    const placaEl = document.getElementById('c-placa');
    const placa = placaEl ? placaEl.value.trim().toUpperCase() : '';
    clients.push({id:nextClientId++, name, phone, cpf, vehicles: placa ? [{id:1, placa, modelo:''}] : []});
  }
  save(); renderAll();
}
function editClient(id){ clientEditId = id; renderClientes(); document.getElementById('tab-clientes').scrollIntoView({behavior:'smooth'}); }
function cancelEditClient(){ clientEditId = null; renderClientes(); }
function removeClient(id){
  if(!confirm('Remover este cliente? O histórico de orçamentos e OS dele é mantido.')) return;
  if(clientEditId===id) clientEditId = null;
  clients = clients.filter(c=>c.id!==id); save(); renderAll();
}
function addVehicle(clientId){
  const placa = prompt('Placa do veículo:'); if(!placa) return;
  const modelo = prompt('Modelo (opcional):') || '';
  const c = clients.find(x=>x.id===clientId);
  if(!c.vehicles) c.vehicles = [];
  const nextVid = c.vehicles.reduce((m,v)=>Math.max(m,v.id||0),0) + 1;
  c.vehicles.push({id:nextVid, placa: placa.trim().toUpperCase(), modelo: modelo.trim()});
  save(); renderAll();
}
function removeVehicle(clientId, vehicleId){
  const c = clients.find(x=>x.id===clientId);
  c.vehicles = (c.vehicles||[]).filter(v=>v.id!==vehicleId);
  save(); renderAll();
}

function renderOrcamentos(){

  const areas = visibleAreas();
  const itemsTotal = quoteDraft.items.reduce((s,it)=>s+it.qty*it.price,0);
  const grandTotal = itemsTotal + (Number(quoteDraft.labor)||0);
  const areaParts = parts.filter(p=>p.area===quoteDraft.area);
  const savedQuotes = quotes.filter(q=>areas.includes(q.area));
  el.innerHTML = `
    <div class="panel">
      <h2>${quoteDraft.id ? `Editando orçamento #${quoteDraft.id}` : 'Novo orçamento'}</h2>
      <div class="row">
        <div><label>Área responsável</label>
          <select id="q-area" onchange="setQuoteArea(this.value)" ${isAdmin()?'':'disabled'}>
            ${isAdmin() ? `
            <option value="mecanica" ${quoteDraft.area==='mecanica'?'selected':''}>Mecânica — Ramiro Henrique</option>
            <option value="pintura" ${quoteDraft.area==='pintura'?'selected':''}>Pintura e Lanternagem — Jorge</option>
            ` : `<option value="${quoteDraft.area}" selected>${areaLabel(quoteDraft.area)} — ${responsibles[quoteDraft.area].name}</option>`}
          </select>
        </div>
      </div>
      <div class="row">
        <div><label>Cliente cadastrado</label>
          <select id="q-client-select" onchange="selectQuoteClient(this.value)">
            <option value="">— selecionar ou digitar abaixo —</option>
            ${clients.map(c=>`<option value="${c.id}" ${quoteDraft.clientId==c.id?'selected':''}>${escapeHtml(clientLabel(c))}</option>`).join('')}
          </select>
        </div>
        <div><label>Nome do cliente</label><input id="q-client" value="${escapeHtml(quoteDraft.client)}" placeholder="Nome do cliente"></div>
        <div><label>Telefone do cliente</label><input id="q-telefone" value="${escapeHtml(quoteDraft.telefone)}" placeholder="(00) 00000-0000"></div>
      </div>
      <label>Adicionar peça ao orçamento</label>
      <div class="item-line">
        <select id="q-part">
          <option value="">Selecione uma peça...</option>
          ${areaParts.map(p=>`<option value="${p.id}">${escapeHtml(p.name)} — ${brl(sellPrice(p))}</option>`).join('')}
        </select>
        <input id="q-qty" type="number" min="1" value="1" placeholder="Qtd">
        <button class="btn secondary" onclick="addQuoteItem()">Adicionar</button>
      </div>
      ${quoteDraft.items.length===0 ? '<div class="empty">Nenhuma peça adicionada ainda.</div>' : `
      <table><tbody>
      ${quoteDraft.items.map((it,i)=>`
        <tr><td>${escapeHtml(it.name)}</td><td class="right">${it.qty} × ${brl(it.price)}</td>
        <td class="right">${brl(it.qty*it.price)}</td>
        <td class="right"><button class="iconbtn" onclick="removeQuoteItem(${i})">✕</button></td></tr>`).join('')}
      </tbody></table>`}
      <div class="row" style="margin-top:8px"><div><label>Mão de obra (R$)</label><input id="q-labor" type="number" step="0.01" min="0" value="${quoteDraft.labor||0}"></div></div>
      <div class="total-line"><span>Total (peças + mão de obra)</span><span>${brl(grandTotal)}</span></div>
      <div class="row" style="margin-top:10px">
        <button class="btn" onclick="saveQuote()">${quoteDraft.id ? 'Salvar alterações' : 'Salvar orçamento'}</button>
        <button class="btn secondary" onclick="clearQuoteDraft()">Limpar</button>
      </div>
    </div>
    <div class="panel">
      <h2>Orçamentos salvos (${savedQuotes.length})</h2>
      ${savedQuotes.length===0 ? '<div class="empty">Nenhum orçamento salvo ainda.</div>' : savedQuotes.slice().reverse().map(q=>renderQuoteCard(q)).join('')}
    </div>`;
}
function selectQuoteClient(val){
  if(!val){ quoteDraft.clientId = null; renderOrcamentos(); return; }
  const c = clients.find(x=>x.id==val);
  if(c){ quoteDraft.clientId = c.id; quoteDraft.client = c.name; quoteDraft.telefone = c.phone||''; }
  renderOrcamentos();
}
function setQuoteArea(area){
  if(!isAdmin()) return;
  if(quoteDraft.items.length && !confirm('Trocar de área limpa as peças já adicionadas (cada área tem seu próprio estoque). Continuar?')) {
    renderOrcamentos(); return;
  }
  quoteDraft.area = area; quoteDraft.items = []; renderOrcamentos();
}
function addQuoteItem(){
  const sel = document.getElementById('q-part');
  const id = parseInt(sel.value); const qty = parseInt(document.getElementById('q-qty').value)||1;
  if(!id){ alert('Selecione uma peça.'); return; }
  const p = parts.find(x=>x.id===id);
  quoteDraft.client = document.getElementById('q-client').value;
  quoteDraft.telefone = document.getElementById('q-telefone').value;
  quoteDraft.labor = document.getElementById('q-labor').value;
  quoteDraft.items.push({partId:p.id, name:p.name, qty, price:sellPrice(p)});
  renderOrcamentos();
}
function removeQuoteItem(i){ quoteDraft.items.splice(i,1); renderOrcamentos(); }
function clearQuoteDraft(){ quoteDraft = {client:'', clientId:null, telefone:'', area: isAdmin()?'mecanica':currentProfile, labor:0, items:[]}; renderOrcamentos(); }
function saveQuote(){
  const client = document.getElementById('q-client').value.trim();
  const telefone = document.getElementById('q-telefone').value.trim();
  const labor = parseFloat(document.getElementById('q-labor').value)||0;
  const area = quoteDraft.area;
  if(!client){ alert('Informe o nome do cliente.'); return; }
  if(quoteDraft.items.length===0 && labor<=0){ alert('Adicione ao menos uma peça ou um valor de mão de obra.'); return; }
  const total = quoteDraft.items.reduce((s,it)=>s+it.qty*it.price,0) + labor;
  const resp = responsibles[area];
  const rec = {id: quoteDraft.id || nextQuoteN, client, clientId: quoteDraft.clientId||null, telefone, area, responsibleName: resp.name, responsiblePhone: resp.phone, date: quoteDraft.date || new Date().toLocaleDateString('pt-BR'), items:quoteDraft.items, labor, total};
  if(!quoteDraft.id){ nextQuoteN++; }
  quotes.push(rec);
  save(); clearQuoteDraft();
}

  const phone = q.telefone || clientPhoneFor(q.clientId);
  const num = toWaNumber(phone);
  if(!num){ return; }
  const itemsText = q.items.map(it=>`• ${it.name} — ${it.qty}x ${brl(it.price)} = ${brl(it.qty*it.price)}`).join('\n');
  const laborText = q.labor ? `• Mão de obra — ${brl(q.labor)}\n` : '';

}

function deleteQuote(id){ if(!confirm('Excluir este orçamento?')) return; quotes = quotes.filter(q=>q.id!==id); save(); renderAll(); }
function editQuote(id){
  const q = quotes.find(x=>x.id===id);
  quoteDraft = { id:q.id, client:q.client, clientId:q.clientId||null, telefone:q.telefone||'', area:q.area||'mecanica', date:q.date, labor:q.labor||0, items:q.items.map(it=>({...it})) };
  quotes = quotes.filter(x=>x.id!==id);
  save(); renderOrcamentos();
  document.getElementById('tab-orcamentos').scrollIntoView({behavior:'smooth'});
}
function quoteToOS(id){
  const q = quotes.find(x=>x.id===id);
  const c = q.clientId ? clients.find(x=>x.id===q.clientId) : null;
  const placa = c && c.vehicles && c.vehicles.length===1 ? c.vehicles[0].placa : '';
  osDraft = { client:q.client, clientId:q.clientId||null, telefone:q.telefone||(c?c.phone:''), cpf:c?c.cpf:'', placa, date:todayIso(), area:q.area||'mecanica', labor:0, items:q.items.map(it=>({...it})), notes:'' };
  switchTab('os'); renderOS();
}

// ---------- OS ----------
function osClientVehicles(){
  if(!osDraft.clientId) return [];
  const c = clients.find(x=>x.id===osDraft.clientId);
  return c ? (c.vehicles||[]) : [];
}
function renderOS(){
  const el = document.getElementById('tab-os');
  const areas = visibleAreas();
  const itemsTotal = osDraft.items.reduce((s,it)=>s+it.qty*it.price,0);
  const grandTotal = itemsTotal + (Number(osDraft.labor)||0);
  const osNumber = osDraft.id || nextOsN;
  const areaParts = parts.filter(p=>p.area===osDraft.area);
  const vehicles = osClientVehicles();
  const savedOs = osList.filter(o=>areas.includes(o.area));
  el.innerHTML = `
    <div class="panel">
      <div class="row" style="align-items:center;margin-bottom:6px">
        <h2 style="flex:2">${osDraft.id ? 'Editando OS' : 'Nova ordem de serviço'}</h2>
        <span class="tag" style="flex:0;font-size:13px">Nº da OS: #${osNumber}</span>
      </div>
      <div class="row">
        <div><label>Área responsável</label>
          <select id="os-area" onchange="setOsArea(this.value)" ${isAdmin()?'':'disabled'}>
            ${isAdmin() ? `
            <option value="mecanica" ${osDraft.area==='mecanica'?'selected':''}>Mecânica — Ramiro Henrique</option>
            <option value="pintura" ${osDraft.area==='pintura'?'selected':''}>Pintura e Lanternagem — Jorge</option>
            ` : `<option value="${osDraft.area}" selected>${areaLabel(osDraft.area)} — ${responsibles[osDraft.area].name}</option>`}
          </select>
        </div>
        <div><label>Cliente cadastrado</label>
          <select id="os-client-select" onchange="selectOsClient(this.value)">
            <option value="">— selecionar ou digitar abaixo —</option>
            ${clients.map(c=>`<option value="${c.id}" ${osDraft.clientId==c.id?'selected':''}>${escapeHtml(clientLabel(c))}</option>`).join('')}
          </select>
        </div>
      </div>
      ${vehicles.length>1 ? `
      <div class="row"><div><label>Veículo deste cliente</label>
        <select onchange="selectOsVehicle(this.value)">
          <option value="">— selecione o veículo —</option>
          ${vehicles.map(v=>`<option value="${v.id}" ${osDraft.placa===v.placa?'selected':''}>${escapeHtml(v.placa)}${v.modelo?' · '+escapeHtml(v.modelo):''}</option>`).join('')}
        </select>
      </div></div>` : ''}
      <div class="row">
        <div><label>Cliente (nome completo)</label><input id="os-client" value="${escapeHtml(osDraft.client)}" placeholder="Nome do cliente"></div>
        <div><label>Telefone do cliente</label><input id="os-telefone" value="${escapeHtml(osDraft.telefone)}" placeholder="(00) 00000-0000"></div>
        <div><label>CPF</label><input id="os-cpf" value="${escapeHtml(osDraft.cpf)}" placeholder="000.000.000-00"></div>
        <div><label>Placa do veículo</label><input id="os-placa" value="${escapeHtml(osDraft.placa)}" placeholder="ABC-1D23" style="text-transform:uppercase"></div>
      </div>
      <div class="row"><div><label>Data</label><input id="os-date" type="date" value="${osDraft.date || todayIso()}"></div></div>
      <label>Adicionar peça</label>
      <div class="item-line">
        <select id="os-part">
          <option value="">Selecione uma peça...</option>
          ${areaParts.map(p=>`<option value="${p.id}">${escapeHtml(p.name)} — ${brl(sellPrice(p))}</option>`).join('')}
        </select>
        <input id="os-qty" type="number" min="1" value="1" placeholder="Qtd">
        <button class="btn secondary" onclick="addOsItem()">Adicionar</button>
      </div>
      ${osDraft.items.length===0 ? '<div class="empty">Nenhuma peça adicionada ainda.</div>' : `
      <table><tbody>
      ${osDraft.items.map((it,i)=>`
        <tr><td>${escapeHtml(it.name)}</td><td class="right">${it.qty} × ${brl(it.price)}</td>
        <td class="right">${brl(it.qty*it.price)}</td>
        <td class="right"><button class="iconbtn" onclick="removeOsItem(${i})">✕</button></td></tr>`).join('')}
      </tbody></table>`}
      <div class="row" style="margin-top:8px"><div><label>Mão de obra (R$)</label><input id="os-labor" type="number" step="0.01" min="0" value="${osDraft.labor||0}"></div></div>
      <label style="margin-top:6px">Observações do serviço</label>
      <textarea id="os-notes" placeholder="Descreva o serviço a ser realizado...">${escapeHtml(osDraft.notes)}</textarea>
      <div class="total-line"><span>Total (peças + mão de obra)</span><span>${brl(grandTotal)}</span></div>
      <div class="row" style="margin-top:10px">
        <button class="btn" onclick="saveOS()">${osDraft.id ? 'Salvar alterações' : 'Emitir OS'}</button>
        <button class="btn secondary" onclick="clearOsDraft()">Limpar</button>
      </div>
    </div>
    <div class="panel">
      <h2>Ordens de serviço (${savedOs.length})</h2>
      ${savedOs.length===0 ? '<div class="empty">Nenhuma OS emitida ainda.</div>' : savedOs.slice().reverse().map(o=>renderOsCard(o)).join('')}
    </div>`;
}
function selectOsClient(val){
  if(!val){ osDraft.clientId = null; renderOS(); return; }
  const c = clients.find(x=>x.id==val);
  if(c){
    osDraft.clientId = c.id; osDraft.client = c.name; osDraft.cpf = c.cpf||''; osDraft.telefone = c.phone||'';
    osDraft.placa = (c.vehicles && c.vehicles.length===1) ? c.vehicles[0].placa : '';
  }
  renderOS();
}
function selectOsVehicle(vehicleId){
  const vehicles = osClientVehicles();
  const v = vehicles.find(x=>x.id==vehicleId);
  osDraft.placa = v ? v.placa : '';
  renderOS();
}
function setOsArea(area){
  if(!isAdmin()) return;
  if(osDraft.items.length && !confirm('Trocar de área limpa as peças já adicionadas (cada área tem seu próprio estoque). Continuar?')) {
    renderOS(); return;
  }
  osDraft.area = area; osDraft.items = []; renderOS();
}
function addOsItem(){
  const sel = document.getElementById('os-part');
  const id = parseInt(sel.value); const qty = parseInt(document.getElementById('os-qty').value)||1;
  if(!id){ alert('Selecione uma peça.'); return; }
  const p = parts.find(x=>x.id===id);
  osDraft.client = document.getElementById('os-client').value;
  osDraft.telefone = document.getElementById('os-telefone').value;
  osDraft.cpf = document.getElementById('os-cpf').value;
  osDraft.placa = document.getElementById('os-placa').value;
  osDraft.date = document.getElementById('os-date').value;
  osDraft.labor = document.getElementById('os-labor').value;
  osDraft.notes = document.getElementById('os-notes').value;
  osDraft.items.push({partId:p.id, name:p.name, qty, price:sellPrice(p)});
  renderOS();
}
function removeOsItem(i){ osDraft.items.splice(i,1); renderOS(); }
function clearOsDraft(){ osDraft = {client:'', clientId:null, telefone:'', cpf:'', placa:'', date:'', area: isAdmin()?'mecanica':currentProfile, labor:0, items:[], notes:''}; renderOS(); }
function saveOS(){
  const client = document.getElementById('os-client').value.trim();
  const telefone = document.getElementById('os-telefone').value.trim();
  const cpf = document.getElementById('os-cpf').value.trim();
  const placa = document.getElementById('os-placa').value.trim().toUpperCase();
  const dateIso = document.getElementById('os-date').value || todayIso();
  const labor = parseFloat(document.getElementById('os-labor').value)||0;
  const notes = document.getElementById('os-notes').value.trim();
  const area = osDraft.area;
  if(!client){ alert('Informe o nome do cliente.'); return; }
  if(osDraft.items.length===0 && labor<=0){ alert('Adicione ao menos uma peça ou um valor de mão de obra.'); return; }
  const short = osDraft.items.filter(it=>{ const p = parts.find(x=>x.id===it.partId); return p && p.stock < it.qty; })
    .map(it=>{ const p = parts.find(x=>x.id===it.partId); return `${it.name} (pede ${it.qty}, tem ${p.stock})`; });
  if(short.length && !confirm('Estoque insuficiente para:\n' + short.join('\n') + '\n\nDeseja emitir a OS mesmo assim? O estoque ficará negativo.')) return;
  const total = osDraft.items.reduce((s,it)=>s+it.qty*it.price,0) + labor;
  const resp = responsibles[area];
  const rec = {id: osDraft.id || nextOsN, client, clientId: osDraft.clientId||null, telefone, cpf, placa, area, responsibleName: resp.name, responsiblePhone: resp.phone, date: isoToDisplay(dateIso), items:osDraft.items, labor, notes, total, status: osDraft.status || 'aberta'};
  if(!osDraft.id){ nextOsN++; }
  adjustStock(osDraft.items, -1);
  osList.push(rec);
  save(); clearOsDraft(); renderAll();
}
function statusLabel(s){ return s==='aberta'?'Aberta':s==='andamento'?'Em andamento':'Concluída'; }
function renderOsCard(o){
  return `<div class="panel" style="background:var(--bg)">
    <div class="row" style="align-items:center;margin-bottom:6px">
      <strong style="flex:2">OS #${o.id} — ${escapeHtml(o.client)}</strong>
      <span class="tag area-${o.area}">${areaLabel(o.area)}</span>
      <span class="tag ${o.status}">${statusLabel(o.status)}</span>
    </div>
    <small class="hint">Emitida em ${o.date} · Responsável: ${escapeHtml(o.responsibleName)}${o.responsiblePhone?` · Tel: ${escapeHtml(o.responsiblePhone)}`:''}${o.cpf?` · CPF ${escapeHtml(o.cpf)}`:''}${o.placa?` · Placa ${escapeHtml(o.placa)}`:''}${o.telefone?` · Tel. cliente: ${escapeHtml(o.telefone)}`:''}</small>
    <table style="margin-top:8px"><tbody>${o.items.map(it=>`<tr><td>${escapeHtml(it.name)}</td><td class="right">${it.qty} × ${brl(it.price)}</td><td class="right">${brl(it.qty*it.price)}</td></tr>`).join('')}
    ${o.labor ? `<tr><td>Mão de obra</td><td></td><td class="right">${brl(o.labor)}</td></tr>` : ''}
    </tbody></table>
    ${o.notes ? `<div class="doc">${escapeHtml(o.notes)}</div>` : ''}
    <div class="total-line" style="font-size:15px"><span>Total</span><span>${brl(o.total)}</span></div>
    <div class="row" style="margin-top:10px">
      <select onchange="setOsStatus(${o.id}, this.value)" style="flex:1">
        <option value="aberta" ${o.status==='aberta'?'selected':''}>Aberta</option>
        <option value="andamento" ${o.status==='andamento'?'selected':''}>Em andamento</option>
        <option value="concluida" ${o.status==='concluida'?'selected':''}>Concluída</option>
      </select>
      <button class="btn secondary" onclick="editOS(${o.id})">Editar</button>
      <button class="btn secondary" onclick="printOS(${o.id})">Imprimir / PDF</button>
      <button class="btn whatsapp" onclick="sendOsWhatsApp(${o.id})">WhatsApp</button>
      <button class="btn danger" onclick="deleteOS(${o.id})">Excluir</button>
    </div>
  </div>`;
}
function sendOsWhatsApp(id){
  const o = osList.find(x=>x.id===id);
  const phone = o.telefone || clientPhoneFor(o.clientId);
  const num = toWaNumber(phone);
  if(!num){ return; }
  const itemsText = o.items.map(it=>`• ${it.name} — ${it.qty}x ${brl(it.price)} = ${brl(it.qty*it.price)}`).join('\n');
  const laborText = o.labor ? `• Mão de obra — ${brl(o.labor)}\n` : '';
  const text = `Olá ${o.client}! Aqui é da Oficina Dois Amigos.\nOS #${o.id} (${areaLabel(o.area)}) — status: ${statusLabel(o.status)}\n\n${itemsText}\n${laborText}\nTotal: ${brl(o.total)}\nResponsável: ${o.responsibleName}\nQualquer dúvida, estamos à disposição!`;
  window.open(`https://wa.me/${num}?text=${encodeURIComponent(text)}`, '_blank');
}
function editOS(id){
  const o = osList.find(x=>x.id===id);
  adjustStock(o.items, 1);
  osDraft = { id:o.id, client:o.client, clientId:o.clientId||null, telefone:o.telefone||'', cpf:o.cpf||'', placa:o.placa||'', date:displayToIso(o.date), area:o.area||'mecanica', labor:o.labor||0, items:o.items.map(it=>({...it})), notes:o.notes||'', status:o.status };
  osList = osList.filter(x=>x.id!==id);
  save(); renderAll();
  document.getElementById('tab-os').scrollIntoView({behavior:'smooth'});
}

    <div><span>Cliente</span>${escapeHtml(o.client)}</div>
    <div><span>CPF</span>${escapeHtml(o.cpf)||'—'}</div>
    <div><span>Placa do veículo</span>${escapeHtml(o.placa)||'—'}</div>
    <div><span>Telefone do cliente</span>${escapeHtml(o.telefone)||'—'}</div>
    <div><span>Responsável</span>${escapeHtml(o.responsibleName)}${o.responsiblePhone?` — ${escapeHtml(o.responsiblePhone)}`:''}</div>
  </div>
  <table><thead><tr><th>Peça</th><th style="text-align:center">Qtd</th><th style="text-align:right">Unit.</th><th style="text-align:right">Subtotal</th></tr></thead>
  <tbody>${rows}${o.labor ? `<tr><td colspan="3">Mão de obra</td><td style="text-align:right">${brl(o.labor)}</td></tr>` : ''}</tbody></table>
  <div class="total"><span>Total</span><span>${brl(o.total)}</span></div>
  ${o.notes ? `<div class="notes">${escapeHtml(o.notes)}</div>` : ''}
  <div class="sign"><div>Assinatura do cliente</div><div>Assinatura da oficina</div></div>
  </body></html>`;
  const w = window.open('', '_blank');
  if(!w){ alert('Permita pop-ups para imprimir a OS.'); return; }
  w.document.open(); w.document.write(html); w.document.close();
  w.onload = () => { w.focus(); w.print(); };
}
function setOsStatus(id, status){ const o = osList.find(x=>x.id===id); o.status=status; save(); renderAll(); }
function deleteOS(id){
  if(!confirm('Excluir esta OS? As peças usadas voltarão para o estoque.')) return;
  const o = osList.find(x=>x.id===id);
  if(o) adjustStock(o.items, 1);
  osList = osList.filter(o=>o.id!==id); save(); renderAll();
}

// ---------- NAV ----------
function switchTab(tab){
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  document.getElementById('tab-painel').style.display = tab==='painel'?'block':'none';
  document.getElementById('tab-estoque').style.display = tab==='estoque'?'block':'none';
  document.getElementById('tab-clientes').style.display = tab==='clientes'?'block':'none';
  document.getElementById('tab-orcamentos').style.display = tab==='orcamentos'?'block':'none';
  document.getElementById('tab-os').style.display = tab==='os'?'block':'none';
}
document.getElementById('nav').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return; switchTab(b.dataset.tab);
});
document.getElementById('tab-painel').innerHTML = '<div class="empty">Conectando ao Firebase…</div>';
</script>
